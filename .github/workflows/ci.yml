# CI (E01-T05). See docs/ci.md for what each job does, how to read failures
# and which checks branch protection on `main` requires.
#
# All jobs run in parallel (each does its own checkout + `npm ci`, which is
# cheap with the npm cache), so the run takes as long as the slowest job (e2e).
# `CI passed` depends on all of them and is the single required check.
name: CI

on:
  # No branch filter, so stacked PRs (base = another feature branch) run too.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its previous run; runs on `main` always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run unit tests with coverage
        run: npm run test:coverage

  db:
    name: Database tests & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Empty database: `start` applies every migration in supabase/migrations
      # and supabase/seed.sql, so a broken migration fails this step.
      # Only Postgres, PostgREST, Kong (API gateway) and GoTrue (needed for
      # `supabase status` to print the API keys) are started.
      - name: Start Supabase and apply migrations
        id: supabase
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Check generated database types are up to date
        run: |
          npm run db:types
          if ! git diff --exit-code -- src/types/database.ts; then
            echo "::error file=src/types/database.ts::src/types/database.ts is out of date with supabase/migrations. Run 'npm run db:reset && npm run db:types' locally and commit the regenerated file."
            exit 1
          fi

      # Settings come from `supabase status -o env` (tests/helpers/local-supabase.ts).
      - name: Run database tests
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: npm run test:db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-cache: true
      - name: Build
        run: npm run build

  # E01-T06 adds a `docker` job ("Docker image") here that builds the image
  # without pushing, and lists it in `ci-passed.needs`.

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional until E04-T01: without both, Clerk sign-in specs are skipped.
      # Clerk *dev* instance keys only (clerkSetup() refuses production keys).
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ vars.E2E_CLERK_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-cache: true

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # Browsers come from the cache, but their system libraries don't.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # With CI set, Playwright builds the app and serves it with `next start`
      # on port 3000 (playwright.config.ts). GitHub sets CI=true already.
      - name: Run e2e tests
        run: npm run e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The one check to require on `main`: fails if any job above failed or was
  # cancelled, so new jobs only need adding to `needs`.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [checks, unit, db, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::At least one CI job failed or was cancelled."
              exit 1
            fi
          done
