# CI (E01-T05). See docs/ci.md for what each job does, how to read failures
# and which checks branch protection on `main` requires.
#
# All jobs run in parallel (each does its own checkout + `npm ci`, which is
# cheap with the npm cache), so the run takes as long as the slowest job (e2e).
# `CI passed` depends on all of them and is the single required check.
name: CI

on:
  # No branch filter, so stacked PRs (base = another feature branch) run too.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its previous run; runs on `main` always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run unit tests with coverage
        run: npm run test:coverage

  db:
    name: Database tests & types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Empty database: `start` applies every migration in supabase/migrations
      # and supabase/seed.sql, so a broken migration fails this step.
      # Only Postgres, PostgREST, Kong (API gateway) and GoTrue (needed for
      # `supabase status` to print the API keys) are started.
      - name: Start Supabase and apply migrations
        id: supabase
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Check generated database types are up to date
        run: |
          npm run db:types
          if ! git diff --exit-code -- src/types/database.ts; then
            echo "::error file=src/types/database.ts::src/types/database.ts is out of date with supabase/migrations. Run 'npm run db:reset && npm run db:types' locally and commit the regenerated file."
            exit 1
          fi

      # Settings come from `supabase status -o env` (tests/helpers/local-supabase.ts).
      - name: Run database tests
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: npm run test:db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-cache: true
      # No Sentry variables: proves the build needs no Sentry account/token.
      - name: Build
        run: npm run build

  # Builds the production image (Dockerfile) without pushing it, then starts it
  # and waits for its HEALTHCHECK, so a broken Dockerfile or an app that can't
  # boot in the image fails the PR. Coolify builds its own image (E01-T08).
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned to commit SHAs (docs/ci.md).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No NEXT_PUBLIC_* or Sentry build args/secrets: the build doesn't need
      # them, and the image is only smoke-tested. Layers are cached in the
      # GitHub Actions cache.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: gym-tracker:ci
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        run: docker image ls gym-tracker:ci

      - name: Start container and wait for the health check
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker run -d --name app -p 3000:3000 gym-tracker:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' app)"
            echo "Health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          docker logs app
          if [ "$status" != "healthy" ]; then
            echo "::error file=Dockerfile::The container did not become healthy (status: $status)."
            exit 1
          fi
          test "$(docker exec app id -u)" != "0" || { echo "::error file=Dockerfile::The container runs as root."; exit 1; }
          body="$(curl -fsS http://127.0.0.1:3000/api/health)"
          echo "GET /api/health → $body"
          test "$body" = "{\"status\":\"ok\",\"version\":\"$APP_VERSION\"}"

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional until E04-T01: without both, Clerk sign-in specs are skipped.
      # Clerk *dev* instance keys only (clerkSetup() refuses production keys).
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ vars.E2E_CLERK_USER_EMAIL }}
      # E01-T07: the build sends error events to a fake Sentry ingest server
      # that tests/e2e/error-tracking.spec.ts starts on this port (no real
      # Sentry project or token involved); /debug/error throws test errors.
      NEXT_PUBLIC_SENTRY_DSN: http://public@127.0.0.1:8999/1
      ENABLE_TEST_ERROR_PAGE: "1"
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          next-cache: true

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # Browsers come from the cache, but their system libraries don't.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # With CI set, Playwright builds the app and serves it with `next start`
      # on port 3000 (playwright.config.ts). GitHub sets CI=true already.
      - name: Run e2e tests
        run: npm run e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The one check to require on `main`: fails if any job above failed or was
  # cancelled, so new jobs only need adding to `needs`.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [checks, unit, db, build, docker, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::At least one CI job failed or was cancelled."
              exit 1
            fi
          done
